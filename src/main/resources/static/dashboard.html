<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - FincaRent</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">

        <span class="navbar-brand">
            <i class="bi bi-house-heart-fill"></i>
            Panel Administrativo FincaRent
        </span>

        <div class="d-flex align-items-center gap-2">
            <a href="/index.html" class="btn btn-outline-light">
                Catálogo
            </a>
            <button type="button" class="btn btn-light" onclick="cerrarSesion()">
                Cerrar sesión
            </button>
        </div>

    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h2 class="mb-0">Registros</h2>

        <div class="d-flex align-items-center gap-2">
            <label for="rolDashboard" class="form-label mb-0 fw-semibold">Rol de consulta:</label>
            <select id="rolDashboard" class="form-select form-select-sm" style="width: auto;" onchange="cargarDashboard()">
                <option value="ADMINISTRADOR" selected>ADMINISTRADOR</option>
                <option value="PROPIETARIO">PROPIETARIO</option>
                <option value="CLIENTE">CLIENTE</option>
            </select>
            <button type="button" class="btn btn-sm btn-success" onclick="cargarDashboard()">
                Actualizar
            </button>
        </div>
    </div>

    <div id="alertaDashboard" class="alert alert-warning d-none"></div>

    <div class="row">

        <!-- FINCAS -->
        <div class="col-md-4 mb-3">

            <div class="card text-center shadow">

                <div class="card-body">

                    <i class="bi bi-house display-4 text-success"></i>

                    <h3 id="totalFincas">9</h3>

                    <p>Fincas Registradas</p>

                </div>

            </div>

        </div>


        <!-- RESERVAS -->
        <div class="col-md-4 mb-3">

            <div class="card text-center shadow">

                <div class="card-body">

                    <i class="bi bi-calendar-check display-4 text-primary"></i>

                    <h3 id="totalReservas">0</h3>

                    <p>Reservas</p>

                </div>

            </div>

        </div>


        <!-- USUARIOS -->
        <div class="col-md-4 mb-3">

            <div class="card text-center shadow">

                <div class="card-body">

                    <i class="bi bi-people display-4 text-warning"></i>

                    <h3 id="totalUsuarios">0</h3>

                    <p>Usuarios</p>

                </div>

            </div>

        </div>

    </div>


    <!-- ÚLTIMAS RESERVAS -->

    <div class="card shadow mt-4">

        <div class="card-header bg-success text-white">

            Últimas Reservas

        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-striped align-middle">

                    <thead>

                        <tr>

                            <th>Cliente</th>

                            <th>Finca</th>

                            <th>Fecha entrada</th>

                            <th>Fecha salida</th>

                            <th>Estado</th>

                            <th>Acción</th>

                        </tr>

                    </thead>

                    <tbody id="tablaReservasBody">

                        <tr>

                            <td colspan="6" class="text-center text-muted">

                                Cargando reservas...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>
    const API_RESERVAS = "/api/reservas";
    const API_USUARIOS = "/api/usuarios";

    function obtenerRolActivo() {
        const selectEl = document.getElementById("rolDashboard");
        const guardado = localStorage.getItem("fincarent_rol");
        if (guardado && selectEl && Array.from(selectEl.options).some(o => o.value === guardado) && !selectEl.dataset.manual) {
            selectEl.value = guardado;
        }
        return selectEl ? selectEl.value : "ADMINISTRADOR";
    }

    function formatearFecha(fechaStr) {
        if (!fechaStr) return "-";
        const partes = String(fechaStr).split("-");
        if (partes.length === 3) {
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }
        return fechaStr;
    }

    function mostrarAlerta(mensaje) {
        const alerta = document.getElementById("alertaDashboard");
        if (!alerta) return;
        if (!mensaje) {
            alerta.textContent = "";
            alerta.classList.add("d-none");
            return;
        }
        alerta.textContent = mensaje;
        alerta.classList.remove("d-none");
    }

    async function cargarUsuarios(rol) {
        const totalUsuariosEl = document.getElementById("totalUsuarios");
        try {
            const resp = await fetch(API_USUARIOS, {
                headers: { "X-Rol": rol }
            });
            if (!resp.ok) return;
            const usuarios = await resp.json();
            if (Array.isArray(usuarios) && totalUsuariosEl) {
                totalUsuariosEl.textContent = usuarios.length;
            }
        } catch (err) {
            // Si el endpoint de usuarios no aplica o falla, mantiene el valor actual
        }
    }

    async function cambiarEstadoReserva(id, nuevoEstado) {
        const rol = obtenerRolActivo();
        mostrarAlerta("");

        try {
            const url = `${API_RESERVAS}/${id}/estado?estado=${encodeURIComponent(nuevoEstado)}`;
            const resp = await fetch(url, {
                method: "PATCH",
                headers: { "X-Rol": rol }
            });

            const data = await resp.json().catch(() => ({}));
            if (!resp.ok) {
                mostrarAlerta(data.message || data.error || `No fue posible cambiar el estado con el rol ${rol}.`);
                return;
            }

            await cargarDashboard();
        } catch (err) {
            mostrarAlerta("Error de conexión al intentar actualizar el estado de la reserva.");
        }
    }

    function renderizarReservas(reservas) {
        const tbody = document.getElementById("tablaReservasBody");
        const totalReservasEl = document.getElementById("totalReservas");

        if (totalReservasEl) {
            totalReservasEl.textContent = Array.isArray(reservas) ? reservas.length : 0;
        }

        if (!tbody) return;

        if (!Array.isArray(reservas) || reservas.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center text-muted">
                        No hay reservas registradas.
                    </td>
                </tr>
            `;
            return;
        }

        tbody.innerHTML = reservas.map(reserva => {
            const estadoActual = reserva.estado || "Confirmada";
            const badgeClase = estadoActual.toLowerCase().includes("cancel") ? "bg-danger" : "bg-success";
            const siguienteEstado = estadoActual.toLowerCase().includes("cancel") ? "Confirmada" : "Cancelada";
            const textoBoton = estadoActual.toLowerCase().includes("cancel") ? "Confirmar" : "Cancelar";

            return `
                <tr>
                    <td>${reserva.nombre ?? ""}</td>
                    <td>${reserva.finca ?? ""}</td>
                    <td>${formatearFecha(reserva.fechaEntrada)}</td>
                    <td>${formatearFecha(reserva.fechaSalida)}</td>
                    <td>
                        <span class="badge ${badgeClase}">
                            ${estadoActual}
                        </span>
                    </td>
                    <td>
                        <button type="button"
                                class="btn btn-sm btn-outline-secondary"
                                onclick="cambiarEstadoReserva(${reserva.id}, '${siguienteEstado}')">
                            ${textoBoton}
                        </button>
                    </td>
                </tr>
            `;
        }).join("");
    }

    async function cargarDashboard() {
        const selectEl = document.getElementById("rolDashboard");
        if (selectEl) selectEl.dataset.manual = "true";
        const rol = obtenerRolActivo();
        mostrarAlerta("");

        await cargarUsuarios(rol);

        try {
            const resp = await fetch(API_RESERVAS, {
                headers: { "X-Rol": rol }
            });

            const data = await resp.json().catch(() => ({}));

            if (!resp.ok) {
                renderizarReservas([]);
                mostrarAlerta(data.message || data.error || `El rol ${rol} no tiene permiso para consultar las reservas.`);
                return;
            }

            renderizarReservas(data);
        } catch (err) {
            renderizarReservas([]);
            mostrarAlerta("No se pudieron cargar las reservas desde el servidor.");
        }
    }

    function cerrarSesion() {
        localStorage.removeItem("fincarent_rol");
        window.location.href = "/login.html";
    }

    document.addEventListener("DOMContentLoaded", cargarDashboard);
</script>

</body>

</html>
